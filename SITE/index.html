<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <title>Teste MindAR - Bolsos</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./assets/02_Bolsos.mind;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true">
      
      <a-assets>
        <a-asset-item id="02_Bolsos" src="./assets/02_Bolsos.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <a-entity position="0 0 0.5" rotation="0 0 0" scale="3 3 3">
          <a-gltf-model src="#02_Bolsos"></a-gltf-model>
        </a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
